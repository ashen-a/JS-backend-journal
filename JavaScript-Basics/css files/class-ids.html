<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes & id's</title>
    <style>
        button {
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: pointer;
        }

        button {
            border: 2px solid grey;
        }

        button {
            border: 2px solid red;
        }

        .my-class-a {
            color: red;
        }

        .my-class-b {
            font-size: 20px;
        }

        #btn-1 {
            color: pink;
        }

    </style>
</head>
<body>
    <button id="btn-1" class="my-class-b">CLick Me</button>
    <button class="my-class-a">CLick Me V2</button>

    <h1 class="my-class-a">Heading</h1>

    <p class="my-class-a my-class-b">Lorem ipsum dolor sit amet consectetur adipisicing elit. Quasi, ad cupiditate sapiente aliquam suscipit a quisquam quam pariatur iusto repudiandae.</p>
</body>
</html>
