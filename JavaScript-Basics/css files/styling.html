<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        button {
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: pointer;
        }

        button {
            border: 2px solid grey;
        }

        button {
            border: 2px solid red;
        }
    </style>
</head>
<body>
    <button>CLick Me</button>
    <button style="border: 2px solid green;">CLick Me V2</button>
    <button>CLick Me V3</button>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quasi, ad cupiditate sapiente aliquam suscipit a quisquam quam pariatur iusto repudiandae.</p>
</body>
</html>
