<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <p>Lorem ipsum dolor <strong>sit</strong> amet.</p>
    <p>Lorem ipsum dolor <b>sit</b> amet.</p>
    <p>Lorem ipsum dolor <em>sit</em> amet.</p>
    <p>Lorem ipsum dolor <i>sit</i> amet.</p>
    <br>
    <br>
    <h2>Lists</h2>
    <ul>
        <li>Orange tea</li>
        <li>Black tea</li>
    </ul>
    <ol>
        <li>Orange tea</li>
        <li>Black tea</li>
    <ol>
        
    <!-- HTML elements can be classified into Block Level Elements(<h1>) & Inline Elements (<img>) -->
    
</body>
</html>
